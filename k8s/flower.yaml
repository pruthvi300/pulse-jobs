# ============================================
# Celery Flower - Monitoring Dashboard
# ============================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: pulse-flower
  namespace: pulse
  labels:
    app: pulse-flower
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pulse-flower
  template:
    metadata:
      labels:
        app: pulse-flower
    spec:
      containers:
        - name: flower
          image: pulse-api:latest
          ports:
            - containerPort: 5555
          env:
            - name: CELERY_BROKER_URL
              valueFrom:
                secretKeyRef:
                  name: pulse-secrets
                  key: CELERY_BROKER_URL
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /
              port: 5555
            initialDelaySeconds: 10
            periodSeconds: 10
          command:
            - "celery"
            - "-A"
            - "app.celery_app"
            - "flower"
            - "--port=5555"

---

apiVersion: v1
kind: Service
metadata:
  name: pulse-flower
  namespace: pulse
spec:
  selector:
    app: pulse-flower
  ports:
    - port: 5555
      targetPort: 5555
  type: ClusterIP
